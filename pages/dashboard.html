<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>My Appointments | NailBloom</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body data-page="dashboard">
    <div id="header"></div>
    <main>
        <section class="page-head container"><span class="eyebrow">MY SPACE</span>
            <h1>My Appointments</h1>
            <p>View and manage your NailBloom bookings.</p>
        </section>
        <section class="section container">
            <div id="stats" class="stats"></div>
            <div id="list" class="booking-card" style="margin-top:20px"></div>
        </section>
    </main>
    <div id="footer"></div>
    <script src="../js/app.js"></script>
    <script src="../js/data.js"></script>
    <script>function render() { const b = getBookings(); stats.innerHTML = `<div class="stat"><span>Total</span><strong>${b.length}</strong></div><div class="stat"><span>Confirmed</span><strong>${b.filter(x => x.status === 'Confirmed').length}</strong></div><div class="stat"><span>Completed</span><strong>${b.filter(x => x.status === 'Completed').length}</strong></div><div class="stat"><span>Cancelled</span><strong>${b.filter(x => x.status === 'Cancelled').length}</strong></div>`; list.innerHTML = b.length ? `<div style="overflow:auto"><table class="table"><thead><tr><th>Service</th><th>Date</th><th>Time</th><th>Artist</th><th>Status</th><th>Action</th></tr></thead><tbody>${b.map(x => `<tr><td>${x.serviceName}</td><td>${x.date}</td><td>${x.time}</td><td>${x.artist}</td><td><span class="status">${x.status}</span></td><td>${x.status === 'Confirmed' ? `<button class="btn light" onclick="cancelBooking(${x.id})">Cancel</button>` : '—'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No appointments yet.<br><a class="btn pink" href="booking.html">Book an Appointment</a></div>' } function cancelBooking(id) { const b = getBookings(); const x = b.find(a => a.id === id); if (x && confirm('Cancel this appointment?')) { x.status = 'Cancelled'; saveBookings(b); toast('Appointment cancelled'); render() } } document.addEventListener('DOMContentLoaded', render)</script>
</body>

</html>
