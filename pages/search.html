<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Search | NailBloom</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body data-page="search">
    <div id="header"></div>
    <main>
        <section class="page-head container"><span class="eyebrow">FIND YOUR STYLE</span>
            <h1>Search Services</h1>
            <p>Find a treatment by name, time or price.</p>
        </section>
        <section class="section container"><input id="q" class="input" placeholder="Try gel, art, spa..."
                style="font-size:1.05rem">
            <div id="results" class="grid three" style="margin-top:22px"></div>
        </section>
    </main>
    <div id="footer"></div>
    <script src="../js/app.js"></script>
    <script src="../js/data.js"></script>
    <script>function go() { let x = q.value.toLowerCase(); results.innerHTML = services.filter(s => (s.name + ' ' + s.desc + ' ' + s.time).toLowerCase().includes(x)).map(s => `<article class="card"><h3>${s.name}</h3><p>${s.desc}</p><span class="tag">${s.time} · ₹${s.price}</span><br><br><a class="btn pink" href="booking.html?service=${s.id}">Book</a></article>`).join('') || '<div class="empty">No matching service.</div>' } document.addEventListener('DOMContentLoaded', go); q.oninput = go</script>
</body>

</html>
