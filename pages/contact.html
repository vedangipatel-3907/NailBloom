<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contact | NailBloom</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body data-page="contact">
    <div id="header"></div>
    <main>
        <section class="page-head container"><span class="eyebrow">CONTACT</span>
            <h1>We'd love to hear from you.</h1>
            <p>Questions, design requests or booking help?</p>
        </section>
        <section class="section container booking-layout">
            <form id="contactForm" class="form-card"><label class="label">Name<input id="cname" class="input"
                        required></label><label class="label">Email<input id="cemail" class="input" type="email"
                        required></label><label class="label">Message<textarea id="cmsg" class="input" rows="7"
                        required></textarea></label><button class="btn pink full">Send Message</button>
                <div id="contactResult"></div>
            </form>
            <div class="card">
                <h2>NailBloom Studio</h2>
                <p>📍 Main Market, City Center</p>
                <p>📞 +91 98765 43210</p>
                <p>📧 hello@nailbloom.demo</p>
                <p>🕘 Mon–Sun · 10 AM–8 PM</p>
            </div>
        </section>
    </main>
    <div id="footer"></div>
    <script src="../js/app.js"></script>
    <script>contactForm.onsubmit = e => { e.preventDefault(); if (!contactForm.checkValidity()) { contactForm.reportValidity(); return } localStorage.setItem('nb_message', JSON.stringify({ name: cname.value, email: cemail.value, message: cmsg.value })); contactResult.innerHTML = '<p class="success">Thank you! Your message was saved.</p>'; contactForm.reset() }</script>
</body>

</html>
