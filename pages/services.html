<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Services | NailBloom</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body data-page="services">
    <div id="header"></div>
    <main>
        <section class="page-head container"><span class="eyebrow">OUR MENU</span>
            <h1>Nail Services</h1>
            <p>Choose your perfect treatment.</p>
        </section>
        <section class="section container">
            <div class="toolbar"><input id="serviceSearch" class="input" placeholder="Search services..."><select
                    id="priceFilter" class="input">
                    <option value="">All prices</option>
                    <option value="800">Under ₹800</option>
                    <option value="1200">Under ₹1200</option>
                </select></div>
            <div id="services" class="grid three"></div>
        </section>
    </main>
    <div id="footer"></div>
    <script src="../js/app.js"></script>
    <script src="../js/data.js"></script>
    <script>function render() { let q = serviceSearch.value.toLowerCase(), p = priceFilter.value; servicesBox.innerHTML = services.filter(s => (!q || (s.name + ' ' + s.desc).toLowerCase().includes(q)) && (!p || s.price <= +p)).map(s => `<article class="card"><img class="service-img" src="${s.img}" alt="${s.name}"><span class="tag">${s.time}</span><h3>${s.name}</h3><p>${s.desc}</p><strong>₹${s.price}</strong><br><a class="btn pink" href="booking.html?service=${s.id}">Book This</a></article>`).join('') || '<div class="empty">No service found.</div>' } const servicesBox = document.getElementById('services'); document.addEventListener('DOMContentLoaded', render); serviceSearch.oninput = render; priceFilter.onchange = render;</script>
</body>

</html>
