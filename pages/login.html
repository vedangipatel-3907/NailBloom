<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login | NailBloom</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body data-page="login">
    <div id="header"></div>
    <main>
        <section class="auth">
            <div class="form-card">
                <h1>Welcome back 💕</h1>
                <p>Demo login: customer@nailbloom.com / 123456</p>
                <form id="login"><label class="label">Email<input id="email" class="input" type="email"
                            required></label><label class="label">Password<input id="password" class="input"
                            type="password" required></label><button class="btn pink full">Login</button>
                    <div id="loginMsg"></div>
                </form>
                <hr>
                <h2>Create account</h2>
                <form id="register"><label class="label">Name<input id="rname" class="input" required></label><label
                        class="label">Email<input id="remail" class="input" type="email" required></label><label
                        class="label">Password<input id="rpass" class="input" type="password" minlength="6"
                            required></label><button class="btn light full">Register</button>
                    <div id="regMsg"></div>
                </form>
            </div>
        </section>
    </main>
    <div id="footer"></div>
    <script src="../js/app.js"></script>
    <script>login.onsubmit = e => { e.preventDefault(); if (email.value === 'customer@nailbloom.com' && password.value === '123456') { localStorage.setItem('nb_user', JSON.stringify({ name: 'NailBloom Customer', email: email.value })); loginMsg.innerHTML = '<p class="success">Login successful. Opening dashboard...</p>'; setTimeout(() => location.href = 'dashboard.html', 500) } else loginMsg.innerHTML = '<p class="error">Invalid demo login.</p>' }; register.onsubmit = e => { e.preventDefault(); localStorage.setItem('nb_user', JSON.stringify({ name: rname.value, email: remail.value })); regMsg.innerHTML = '<p class="success">Account created successfully.</p>'; setTimeout(() => location.href = 'dashboard.html', 500) }</script>
</body>

</html>
